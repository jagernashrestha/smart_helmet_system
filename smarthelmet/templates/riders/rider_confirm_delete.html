{% extends 'base.html' %}
{% block title %}Delete Rider{% endblock %}
{% block page_title %}Delete Rider{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white p-3">
                <i class="bi bi-exclamation-triangle me-2"></i>Confirm Delete
            </div>
            <div class="card-body text-center py-5">
                <i class="bi bi-person-x" style="font-size:3rem; color:#dc3545;"></i>
                <h5 class="mt-3">Delete <strong>{{ rider.name }}</strong>?</h5>
                <p class="text-muted">Helmet: {{ rider.helmet_id }}<br>This action cannot be undone.</p>
                <form method="post" class="mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">
                        <i class="bi bi-trash me-1"></i>Yes, Delete
                    </button>
                    <a href="{% url 'rider_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
